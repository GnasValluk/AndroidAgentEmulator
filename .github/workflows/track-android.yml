name: track-android
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
jobs:
  resolve:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Resolve newest Android API (no hardcode)
        run: go run ./cmd/emulator-cli --api auto version
      - name: Integrity readiness
        run: go run ./cmd/emulator-cli --api auto integrity
