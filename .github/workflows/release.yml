name: release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build
        run: go build -ldflags "-X main.cliVersion=${{ github.ref_name }}" -o emulator-cli.exe ./cmd/emulator-cli
      - name: Smoke
        run: |
          ./emulator-cli.exe --version
          ./emulator-cli.exe --api 16 qemu-dry-run
      - name: Checksum
        run: (Get-FileHash emulator-cli.exe -Algorithm SHA256).Hash | Out-File emulator-cli.exe.sha256
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            emulator-cli.exe
            emulator-cli.exe.sha256
          generate_release_notes: true
