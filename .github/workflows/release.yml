name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Check installer version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $iss = Get-Content installer/AndroidLab.iss -Raw
          if ($iss -notmatch "#define MyAppVersion `"$tag`"") { throw "AndroidLab.iss MyAppVersion does not match tag $tag" }
      - name: Build CLI
        run: go build -ldflags "-X main.cliVersion=${{ github.ref_name }}" -o emulator-cli.exe ./cmd/emulator-cli
      - name: Smoke CLI
        run: |
          ./emulator-cli.exe --version
          ./emulator-cli.exe --api 16 qemu-dry-run
      - name: Build launchers
        run: |
          New-Item -ItemType Directory -Force installer/staging | Out-Null
          go build -o installer/staging/launcher.exe ./cmd/launcher
          Copy-Item installer/staging/launcher.exe installer/staging/Tablet15.exe -Force
          Copy-Item installer/staging/launcher.exe installer/staging/Tablet16.exe -Force
          Copy-Item emulator-cli.exe installer/staging/emulator-cli.exe -Force
          Remove-Item installer/staging/launcher.exe -Force
      - name: Check devices sync
        run: powershell -File scripts/Sync-AndroidLabDevices.ps1 -Check
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Setup
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc.FullName installer\AndroidLab.iss
      - name: Checksum
        run: |
          (Get-FileHash emulator-cli.exe -Algorithm SHA256).Hash | Out-File emulator-cli.exe.sha256
          $setup = Get-ChildItem installer/Output/AndroidLab-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup exe not found in installer/Output" }
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash | Out-File "$($setup.FullName).sha256"
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            emulator-cli.exe
            emulator-cli.exe.sha256
            installer/Output/AndroidLab-Setup-*.exe
            installer/Output/AndroidLab-Setup-*.exe.sha256
          generate_release_notes: true
